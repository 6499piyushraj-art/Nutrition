name: MyNutri build verification

on:
  push:
    branches:
      - tally-neon-postgres
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Type-check
        run: npx tsc --noEmit
