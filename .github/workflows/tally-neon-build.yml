name: Tally Neon build verification

on:
  push:
    branches:
      - tally-neon-postgres
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies and run production build
        run: npm install
      - name: Type-check
        run: npx tsc --noEmit
