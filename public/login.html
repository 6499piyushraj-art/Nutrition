<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8f4">
  <title>MyNutri AI · Sign in</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/login.js" defer></script>
</head>
<body class="auth-page">
  <main class="auth-card">
    <div class="brand-mark" aria-hidden="true">✳</div>
    <p class="eyebrow">MYNUTRI AI</p>
    <h1>Your nutrition, in context.</h1>
    <p class="muted">Sign in to open your personal food log and nutrition dashboard.</p>
    <form id="login-form" class="login-form">
      <label for="password">App password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required minlength="1" placeholder="Enter your private app password">
      <button id="login-button" class="button button-primary" type="submit">Sign in <span aria-hidden="true">→</span></button>
      <p id="login-error" class="form-error" role="alert" aria-live="polite"></p>
    </form>
    <p class="small muted">Your food history stays in this browser. The Gemini key is kept on the server.</p>
  </main>
</body>
</html>
